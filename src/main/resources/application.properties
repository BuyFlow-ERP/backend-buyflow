spring.application.name=buyflow-erp

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-test-query=SELECT sysdate FROM DUAL
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

tomcat.ajp.enabled=${AJP_ENABLED:false}
tomcat.ajp.protocol=AJP/1.3
tomcat.ajp.port=8009

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

server.servlet.context-path=/api

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.upload.dir=${UPLOAD_DIR:/app/uploads}

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=${REQUEST_MAPPING_LOG_LEVEL:INFO}