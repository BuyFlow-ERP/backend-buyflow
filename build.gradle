plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.buyflow'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// implementation 'org.springframework.boot:spring-boot-starter-security' <-- spring security
	// implementation group: 'commons-io', name: 'commons-io', version: '2.11.0' <-- File 쪽.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.apache.commons:commons-lang3:3.12.0'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.78'
	implementation 'com.oracle.database.security:oraclepki:23.3.0.23.09'

	compileOnly 'org.projectlombok:lombok'
	// developmentOnly 'org.springframework.boot:spring-boot-devtools' <-- 필요하면 풀으시오.
	runtimeOnly 'com.oracle.database.jdbc:ojdbc11-production:23.3.0.23.09'
		// runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5' <-- jwt 같은데 implement로 안걸었기에 주석.
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	// testImplementation 'org.springframework.security:spring-security-test' <-- spring security
}

tasks.named('test') {
	useJUnitPlatform()
}
